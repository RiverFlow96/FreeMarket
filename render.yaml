services:
  - name: freemarket-backend
    type: web
    region: oregon
    plan: free
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: sh -c "cd backend && python manage.py migrate --noinput && gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
    healthCheckPath: /admin/login/
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: your-app.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-project.pages.cloudflare.dev
      - key: PYTHONUNBUFFERED
        value: "1"

services:
  - name: FreeMarket
    type: web
    region: oregon
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && python manage.py seed_categories && exec gunicorn --bind 0.0.0.0:$PORT config.wsgi:application
    healthCheckPath: /api/v1/categories/
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: freemarket-ivim.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://freemarket-7vy.pages.dev
      - key: PYTHONUNBUFFERED
        value: "1"

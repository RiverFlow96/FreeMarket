services:
  - name: freemarket-backend
    type: web
    region: oregon
    plan: free
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    buildFilter:
      include:
        - backend/**
        - "!**/*.sqlite3"
    startCommand: cd backend && gunicorn --bind 0.0.0.0:8000 config.wsgi:application
    healthCheckPath: /api/v1/products/
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: your-app.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: freemarket-db
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-project.pages.cloudflare.dev
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: freemarket-db
    plan: free
    region: oregon
    databaseName: postgres
    postgresMajorVersion: "15"
